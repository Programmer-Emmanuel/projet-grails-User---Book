info:
  app:
    name: '@info.app.name@'
    version: '@info.app.version@'
    grailsVersion: '@info.app.grailsVersion@'
grails:
  views:
    default:
      codec: html
    gsp:
      encoding: UTF-8
      htmlcodec: xml
      codecs:
        expression: html
        scriptlet: html
        taglib: none
        staticparts: none
  codegen:
    defaultPackage: test
  profile: web
  mime:
    disable:
      accept:
        header:
          userAgents:
            - Gecko
            - WebKit
            - Presto
            - Trident
    types:
      all: '*/*'
      atom: application/atom+xml
      css: text/css
      csv: text/csv
      form: application/x-www-form-urlencoded
      html:
        - text/html
        - application/xhtml+xml
      js: text/javascript
      json:
        - application/json
        - text/json
      multipartForm: multipart/form-data
      pdf: application/pdf
      rss: application/rss+xml
      text: text/plain
      hal:
        - application/hal+json
        - application/hal+xml
      xml:
        - text/xml
        - application/xml
  plugin:
    springsecurity:
      securityConfigType: InterceptUrlMap
      interceptUrlMap:
        - pattern: /api/register
          access:
            - permitAll

        - pattern: /api/login
          access:
            - permitAll

        - pattern: /api/**
          access:
            - isFullyAuthenticated()

        - pattern: /**
          access:
            - permitAll
      filterChain:
        chainMap:
          - pattern: /api/login
            filters: JOINED_FILTERS

          - pattern: /api/register
            filters: JOINED_FILTERS,-restTokenValidationFilter

          - pattern: /api/**
            filters: JOINED_FILTERS,-anonymousAuthenticationFilter

          - pattern: /**
            filters: JOINED_FILTERS,-restTokenValidationFilter
      rest:
        login:
          active: true
          endpointUrl: /api/login
          useJsonCredentials: true
          usernamePropertyName: username
          passwordPropertyName: password
        token:
          storage:
            jwt:
              secret: "9f3c1a7b2d4e8f6c1a9d3b7e5f0c2a8d9c7e1f4a6b8d0c2e9f1a3b5c7d8e0f1"
dataSource:
  driverClassName: org.mariadb.jdbc.Driver
  username: root
  password: 'example'
  pooled: true
  jmxExport: true
environments:
  development:
    dataSource:
      dbCreate: update
      url: jdbc:mariadb://localhost:60027/test
      dialect: org.hibernate.dialect.MariaDBDialect
  test:
    dataSource:
      dbCreate: update
      url: jdbc:mariadb://localhost:60027/test
      dialect: org.hibernate.dialect.MariaDBDialect
  production:
    dataSource:
      dbCreate: none
      url: jdbc:mariadb://localhost:60027/test
      dialect: org.hibernate.dialect.MariaDBDialect
      properties:
        jmxEnabled: true
        initialSize: 5
        maxActive: 50
        minIdle: 5
        maxIdle: 25
        maxWait: 10000
        maxAge: 600000
        timeBetweenEvictionRunsMillis: 5000
        minEvictableIdleTimeMillis: 60000
        validationQuery: SELECT 1
        validationQueryTimeout: 3
        validationInterval: 15000
        testOnBorrow: true
        testWhileIdle: true
        testOnReturn: false
        jdbcInterceptors: ConnectionState
        defaultTransactionIsolation: 2
hibernate:
  cache:
    queries: false
    use_second_level_cache: false
    use_query_cache: false
server:
  port: 8084
logging:
  level:
    grails.plugin.springsecurity: DEBUG
    org.springframework.security: DEBUG